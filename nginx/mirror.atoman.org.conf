limit_conn_zone $binary_remote_addr zone=mirror_per_ip:10m;
limit_req_zone $binary_remote_addr zone=mirror_metadata:10m rate=30r/s;

map $uri $mirror_robots_tag {
    default "noindex, nofollow, noarchive";
    / "";
    /index.html "";
    /styles.css "";
    /app.js "";
    /robots.txt "";
    /sitemap.xml "";
}

server {
    listen 80;
    listen [::]:80;
    server_name mirror.atoman.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mirror.atoman.org;

    ssl_certificate /etc/nginx/ssl/api.atoman.org.pem;
    ssl_certificate_key /etc/nginx/ssl/api.atoman.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mirror.atoman.org.access.log;
    error_log /var/log/nginx/mirror.atoman.org.error.log warn;

    client_max_body_size 2m;
    limit_conn mirror_per_ip 8;

    add_header X-Robots-Tag $mirror_robots_tag always;

    location = /v2 {
        return 308 /v2/;
    }

    location ^~ /v2/gcr.io/ {
        return 404;
    }

    location ^~ /v2/quay.io/ {
        return 404;
    }

    location ^~ /v2/registry.k8s.io/ {
        return 404;
    }

    location ^~ /v2/ {
        proxy_hide_header X-Robots-Tag;
        proxy_pass http://127.0.0.1:50001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_redirect off;
    }

    location = /token {
        proxy_pass http://127.0.0.1:50001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_redirect off;
    }

    location ^~ /token/ {
        proxy_pass http://127.0.0.1:50001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_redirect off;
    }

    location = /ubuntu {
        return 308 /ubuntu/;
    }

    location ^~ /ubuntu/ {
        proxy_pass https://archive.ubuntu.com/ubuntu/;
        proxy_http_version 1.1;
        proxy_set_header Host archive.ubuntu.com;
        proxy_ssl_server_name on;
        proxy_ssl_name archive.ubuntu.com;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /ubuntu-security {
        return 308 /ubuntu-security/;
    }

    location ^~ /ubuntu-security/ {
        proxy_pass https://security.ubuntu.com/ubuntu/;
        proxy_http_version 1.1;
        proxy_set_header Host security.ubuntu.com;
        proxy_ssl_server_name on;
        proxy_ssl_name security.ubuntu.com;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /debian {
        return 308 /debian/;
    }

    location ^~ /debian/ {
        proxy_pass https://deb.debian.org/debian/;
        proxy_http_version 1.1;
        proxy_set_header Host deb.debian.org;
        proxy_ssl_server_name on;
        proxy_ssl_name deb.debian.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /debian-security {
        return 308 /debian-security/;
    }

    location ^~ /debian-security/ {
        proxy_pass https://security.debian.org/debian-security/;
        proxy_http_version 1.1;
        proxy_set_header Host security.debian.org;
        proxy_ssl_server_name on;
        proxy_ssl_name security.debian.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /go {
        return 308 /go/;
    }

    location ^~ /go/ {
        limit_req zone=mirror_metadata burst=60 nodelay;

        proxy_pass https://proxy.golang.org/;
        proxy_http_version 1.1;
        proxy_set_header Host proxy.golang.org;
        proxy_ssl_server_name on;
        proxy_ssl_name proxy.golang.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /gosumdb {
        return 308 /gosumdb/;
    }

    location ^~ /gosumdb/ {
        limit_req zone=mirror_metadata burst=60 nodelay;

        proxy_pass https://sum.golang.org/;
        proxy_http_version 1.1;
        proxy_set_header Host sum.golang.org;
        proxy_ssl_server_name on;
        proxy_ssl_name sum.golang.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
    }

    location = /pypi/simple {
        return 308 /pypi/simple/;
    }

    location ^~ /pypi/simple/ {
        limit_req zone=mirror_metadata burst=60 nodelay;

        proxy_pass https://pypi.org/simple/;
        proxy_http_version 1.1;
        proxy_set_header Host pypi.org;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name pypi.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;

        sub_filter_once off;
        sub_filter_types application/json application/vnd.pypi.simple.v1+json;
        sub_filter 'https://files.pythonhosted.org/' 'https://mirror.atoman.org/pypi/files/';
    }

    location ^~ /pypi/files/ {
        proxy_pass https://files.pythonhosted.org/;
        proxy_http_version 1.1;
        proxy_set_header Host files.pythonhosted.org;
        proxy_ssl_server_name on;
        proxy_ssl_name files.pythonhosted.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
    }

    location = /npm {
        return 308 /npm/;
    }

    location ^~ /npm/ {
        limit_req zone=mirror_metadata burst=60 nodelay;

        proxy_pass https://registry.npmjs.org/;
        proxy_http_version 1.1;
        proxy_set_header Host registry.npmjs.org;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name registry.npmjs.org;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;

        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'https://registry.npmjs.org/' 'https://mirror.atoman.org/npm/';
    }

    location = /robots.txt {
        include /etc/nginx/snippets/atoman-mirror-static-security.conf;
        root /var/www/atoman-mirror;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/atoman-mirror-static-security.conf;
        root /var/www/atoman-mirror;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/atoman-mirror-static-security.conf;
        root /var/www/atoman-mirror;
        try_files /index.html =404;
    }

    location ~ ^/(?:index\.html|styles\.css|app\.js)$ {
        include /etc/nginx/snippets/atoman-mirror-static-security.conf;
        root /var/www/atoman-mirror;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
